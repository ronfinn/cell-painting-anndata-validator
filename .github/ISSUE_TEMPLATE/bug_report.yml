name: Bug report
description: Report a defect in the validator, CLI or documentation site.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for a report. **Do not attach private, proprietary or sensitive datasets.**
        Prefer a minimal synthetic `.h5ad` (or a column/`uns` sketch) that reproduces the issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands or Python snippet. Synthetic data only.
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include exit code, traceback, and relevant rule codes.
    validations:
      required: true
  - type: input
    id: package_version
    attributes:
      label: Package version
      description: Output of `cp-validate --version` or `cp_anndata_validator.__version__`.
      placeholder: "0.2.0b1"
    validations:
      required: true
  - type: input
    id: schema
    attributes:
      label: Schema
      description: Built-in name or note that a custom schema was used.
      placeholder: generic-cell-painting
  - type: textarea
    id: rule_codes
    attributes:
      label: Rule codes (if any)
      placeholder: IDENT001, AGG001, ...
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, install method (`uv sync`, local wheel, …).
    validations:
      required: true
  - type: textarea
    id: redacted_shape
    attributes:
      label: Redacted dataset shape (optional)
      description: n_obs, n_vars, obs/var column names, uns keys — no private values.
