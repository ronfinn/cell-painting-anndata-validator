schema_id: generic-cell-painting
schema_version: "0.2.1"
description: >
  Vendor-neutral schema for Cell Painting profiles. Does not assume any
  single upstream pipeline's exact column spelling: canonical fields are
  matched via a list of common aliases instead of one required name.

fields:
  plate:
    aliases: [plate_id, plate, Metadata_Plate]
    location: obs
    required_for: [single-cell, well]
    description: Plate identifier.
  well:
    aliases: [well_id, well, Metadata_Well]
    location: obs
    required_for: [single-cell, well]
    description: Well identifier within a plate.
  site:
    aliases: [site_id, site, field_of_view, Metadata_Site]
    location: obs
    required_for: [single-cell]
    description: Imaging site / field of view identifier within a well.
  cell_id:
    aliases: [cell_id, object_id, Metadata_ObjectNumber]
    location: obs
    required_for: [single-cell]
    description: Cell or segmented-object identifier within a site.
  perturbation_id:
    # Precedence: generic canonical aliases first, then evidenced JUMP-style
    # columns. First match wins (case-insensitive, exact).
    aliases:
      [
        perturbation_id,
        pert_id,
        treatment_id,
        Metadata_broad_sample,
        Metadata_pert_iname,
        Metadata_JCP2022,
      ]
    location: obs
    required_for: [treatment]
    description: Identifier of the perturbation applied to a well or treatment group.
  perturbation_modality:
    # Note: do NOT add Metadata_pert_type here. In LINCS / pycytominer exports,
    # Metadata_pert_type is control vs treatment status (see control_type), not
    # chemical/genetic/ORF modality. Bare "pert_type" remains a modality shorthand.
    aliases: [perturbation_modality, modality, pert_type]
    location: obs
    required_for: []
    description: >
      Perturbation modality (for example compound, orf, crispr). Not the same as
      LINCS Metadata_pert_type, which denotes control/treatment status.
  control_type:
    aliases: [control_type, control_annotation, Metadata_pert_type]
    location: obs
    required_for: []
    description: >
      Control/treatment annotation (for example negcon, poscon, trt). In LINCS
      Cell Painting exports, Metadata_pert_type commonly carries this meaning.
  batch:
    aliases: [batch_id, batch, Metadata_Batch, Metadata_Batch_Number]
    location: obs
    required_for: []
    description: Experimental batch identifier.
  source:
    aliases: [source_id, source, Metadata_Source]
    location: obs
    required_for: []
    description: Data-generating site/laboratory identifier.

compartments: [Cells, Cytoplasm, Nuclei, Image]
measurement_families:
  [
    AreaShape,
    Intensity,
    Texture,
    RadialDistribution,
    Granularity,
    Neighbors,
    Location,
    Correlation,
    Count,
    Threshold,
    Children,
    Parent,
    Number,
    ObjectSkeleton,
    Math,
    Overlap,
    SizeShape,
    AreaOccupied,
    ImageQuality,
  ]
